[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eizo-dev"
version = "1.0.1"
description = "映像 — Codebase Knowledge Graph CLI. Parseia codebases com Tree-sitter, constrói grafo de conhecimento em SQLite, expõe queries via CLI e MCP."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Walter Nagai", email = "walter@ninja-apps.work"},
]

keywords = [
    "code-graph", "knowledge-graph", "tree-sitter", "mcp",
    "code-analysis", "graphrag", "cli",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-php>=0.23",
    "tree-sitter-ruby>=0.23",
    # >=1.28: versões anteriores geram o output schema das tools de forma
    # incompatível com pydantic>=2.11; este piso força a resolução correta
    # da constraint transitiva pydantic>=2.11.
    # <2.0: mcp 2.0 removeu mcp.server.fastmcp (ModuleNotFoundError) e o
    # decorator @mcp.tool() deixou de ser tipado (mypy strict falha com
    # untyped-decorator). O código usa a API 1.x.
    "mcp>=1.28,<2.0",
    # >=1.1: versão testada com a factory "gitignore" (sucessora
    # não-deprecated de "gitwildmatch") em PathSpec.from_lines().
    "pathspec>=1.1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
eizo = "eizo.cli:main"

[project.urls]
Homepage = "https://github.com/walternagai/eizo"
Repository = "https://github.com/walternagai/eizo"
Changelog = "https://github.com/walternagai/eizo/blob/main/CHANGELOG.md"
Issues = "https://github.com/walternagai/eizo/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["eizo*"]

[tool.setuptools.package-data]
"eizo.static" = ["*.template"]
"eizo.static.vendor" = ["*.js"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["ARG001"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_any_unimported = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
