# Publish do eizo-dev no PyPI via trusted publishing (OIDC).
#
# GATILHO: push de tag v* (ex.: v1.0.2). O workflow valida que a tag
# corresponde à versão declarada no pyproject.toml antes de publicar.
#
# SETUP ÚNICO (obrigatório antes do primeiro run):
#   1. No PyPI: pypi.org/manage/project/eizo-dev/settings/publishing/
#      → "Add a new pending publisher":
#        owner: walternagai
#        repository: eizo
#        workflow name: publish.yml
#        environment: (vazio — este workflow não usa environment)
#   2. Faça o push da tag: git tag v1.0.2 && git push origin v1.0.2
#
# Sem segredo algum: o PyPI confia no workflow via OIDC (id-token),
# eliminando o token de API do ambiente.

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  # OIDC do GitHub para o trusted publishing do PyPI (mínimo necessário)
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Validate tag matches package version
        run: |
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "pyproject: ${PKG_VERSION} | tag: ${TAG_VERSION}"
          if [ "${PKG_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::Tag v${TAG_VERSION} não corresponde à versão do pacote ${PKG_VERSION} — ajuste o pyproject.toml ou a tag."
            exit 1
          fi

      - name: Build wheel and sdist
        run: python -m build

      - name: Twine check (metadata gate)
        run: python -m twine check dist/*

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        # Sem 'password': a action usa o OIDC do GitHub quando
        # id-token: write está ativo e nenhum token é fornecido.